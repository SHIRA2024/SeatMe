<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventFlow – פרטי האירוע</title>
<link rel="stylesheet" href="shared.css">
<style>
.hero {
  position: relative;
  height: 280px;
  overflow: hidden;
  flex-shrink: 0;
}
.hero-img {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #d4c4a8 0%, #c9b99a 30%, #e8d5b0 60%, #d6c8a4 100%);
  display: flex; align-items: center; justify-content: center;
}
.hero-flowers {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80px 60px at 15% 70%, rgba(255,220,190,0.7) 0%, transparent 60%),
    radial-gradient(ellipse 60px 50px at 85% 60%, rgba(240,200,160,0.6) 0%, transparent 60%),
    radial-gradient(ellipse 100px 80px at 50% 80%, rgba(255,235,200,0.5) 0%, transparent 60%),
    linear-gradient(180deg, rgba(220,200,170,0.4) 0%, rgba(180,155,120,0.6) 100%);
}
.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.45) 100%);
}
.hero-badges {
  position: absolute; top: 16px; right: 16px; left: 16px;
  display: flex; justify-content: space-between; align-items: center;
}
.hero-heart { font-size: 22px; }
.hero-title {
  position: absolute; bottom: 16px; right: 16px; left: 16px; color: white;
}
.hero-title h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
.hero-title p { font-size: 14px; opacity: 0.85; margin-top: 2px; }
.hero-dots {
  position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 5px;
}
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.5); }
.dot.active { background: white; }

.info-card {
  margin: 16px; border-radius: 16px; padding: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1); border: 1px solid var(--gray4);
}
.info-title { font-size: 20px; font-weight: 800; color: var(--dark); text-align: center; }
.info-sub { font-size: 13px; color: var(--gray2); text-align: center; margin-top: 4px; }
.info-divider { height: 1px; background: var(--gray4); margin: 14px 0; }
.info-row {
  display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 10px 0;
}
.info-row:not(:last-child) { border-bottom: 1px solid var(--gray5); }
.info-row-text { text-align: right; }
.info-row-label { font-size: 12px; color: var(--gray2); margin-bottom: 2px; }
.info-row-value { font-size: 15px; font-weight: 700; color: var(--dark); }

.action-row {
  display: flex; justify-content: space-around; padding: 8px 16px 16px; gap: 8px;
}
.action-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer; background: none; border: none; padding: 0;
}
.action-btn-icon {
  width: 50px; height: 50px; border-radius: 50%; border: 1.5px solid var(--gray4);
  display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.action-btn span { font-size: 12px; color: var(--dark); }

.rsvp-section { padding: 8px 16px 24px; }
.rsvp-note { font-size: 11px; color: var(--gray2); text-align: center; margin-bottom: 10px; direction: rtl; }
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <div style="display:flex;gap:3px;align-items:flex-end">
      <div style="width:3px;height:5px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:8px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:11px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:14px;background:#1C1C1C;border-radius:1px"></div>
    </div>
    <div>9:41</div>
    <div style="display:flex;gap:5px;align-items:center;font-size:16px">
      <span>&#x1F4F6;</span>
      <span>&#x1F50B;</span>
    </div>
  </div>

  <!-- Nav Bar -->
  <div class="nav-bar">
    <div class="nav-icon-dark" style="font-size:16px">⚡</div>
    <div class="title">EventFlow</div>
    <div style="width:36px"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <!-- Hero -->
    <div class="hero">
      <div class="hero-img">
        <div class="hero-flowers"></div>
        <!-- Decorative flower silhouettes -->
        <svg width="375" height="280" style="position:absolute;top:0;left:0" viewBox="0 0 375 280">
          <circle cx="60" cy="180" r="30" fill="rgba(255,230,190,0.4)"/>
          <circle cx="100" cy="200" r="20" fill="rgba(240,210,170,0.5)"/>
          <circle cx="300" cy="170" r="35" fill="rgba(255,225,185,0.4)"/>
          <circle cx="200" cy="210" r="25" fill="rgba(245,220,175,0.35)"/>
          <ellipse cx="150" cy="195" rx="40" ry="25" fill="rgba(255,240,200,0.3)"/>
          <ellipse cx="250" cy="205" rx="35" ry="20" fill="rgba(240,215,165,0.35)"/>
        </svg>
      </div>
      <div class="hero-overlay"></div>
      <div class="hero-badges">
        <span class="badge badge-orange" style="font-size:13px">הזמנה רשמית</span>
        <span style="font-size:22px;color:white;opacity:0.8">♡</span>
      </div>
      <div class="hero-title">
        <h2>נועה &amp; איתי</h2>
        <p>!מתמסרים בקרוב</p>
      </div>
      <div class="hero-dots" style="bottom:8px">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Info Card -->
    <div class="info-card">
      <div class="info-title">נשמח לראותכם בין אורחינו</div>
      <div class="info-sub">יום חמישי | י"ח באלול תשפ"ד</div>
      <div class="info-divider"></div>

      <div class="info-row">
        <div class="info-row-text">
          <div class="info-row-label">תאריך</div>
          <div class="info-row-value">בספטמבר, 14 2024</div>
        </div>
        <div class="icon-circle icon-circle-orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
      </div>

      <div class="info-row">
        <div class="info-row-text">
          <div class="info-row-label">שעה</div>
          <div class="info-row-value">קבלת פנים – 19:30</div>
        </div>
        <div class="icon-circle icon-circle-orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/>
          </svg>
        </div>
      </div>

      <div class="info-row" style="border-bottom:none">
        <div class="info-row-text">
          <div class="info-row-label">מיקום</div>
          <div class="info-row-value">מתחם האירועים "החצר", קיסריה</div>
        </div>
        <div class="icon-circle icon-circle-orange">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-row">
      <button class="action-btn">
        <div class="action-btn-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1C" stroke-width="1.8">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        </div>
        <span>ניווט ליעד</span>
      </button>
      <button class="action-btn">
        <div class="action-btn-icon" style="font-size:22px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1C" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="17" y="17" width="4" height="4"/>
            <rect x="14" y="14" width="4" height="4"/>
          </svg>
        </div>
        <span>הקוד שלי</span>
      </button>
      <button class="action-btn">
        <div class="action-btn-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1C1C1C" stroke-width="1.8">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </div>
        <span>שיתוף הזמנה</span>
      </button>
    </div>

    <!-- RSVP -->
    <div class="rsvp-section">
      <div class="rsvp-note">*אישי או אישור הגנה בתיאום מראש QR הכניסה לאירוע מותנית בהצגת קוד*<br>עם המארחים.</div>
      <button class="btn-orange">
        <span>צפה בהזמנה ו-RSVP</span>
        <span style="font-size:20px">‹</span>
      </button>
    </div>
  </div>
</div>
</body>
</html>
