<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventFlow – עורך סידור ישיבה</title>
<link rel="stylesheet" href="shared.css">
<style>
.toolbar { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; }
.toolbar::-webkit-scrollbar { display: none; }
.tool-btn {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 14px; background: var(--gray5); border-radius: 12px; cursor: pointer;
  border: 1.5px solid var(--gray4); white-space: nowrap;
}
.tool-btn span { font-size: 11px; color: var(--dark); }
.tool-icon { font-size: 20px; }

.tables-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 12px 16px; }
.table-circle-wrap { display: flex; justify-content: center; align-items: center; }
.table-circle {
  width: 130px; height: 130px; border-radius: 50%; border: 2px solid var(--gray4);
  background: white; display: flex; flex-direction: column; align-items: center;
  justify-content: center; position: relative; cursor: pointer;
}
.table-circle.selected { border: 3px solid var(--orange); }
.table-circle .seats {
  position: absolute; display: flex;
}
.seat-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gray4); border: 1px solid var(--gray3); }
.seat-dot.filled { background: var(--gray3); }
.table-name { font-size: 11px; color: var(--gray2); margin-bottom: 2px; }
.table-num { font-size: 28px; font-weight: 900; color: var(--dark); line-height: 1; }
.table-capacity { font-size: 12px; color: var(--gray2); margin-top: 4px; background: var(--gray5); border-radius: 20px; padding: 2px 10px; }
.table-capacity.full { background: var(--orange-light); color: var(--orange); }

.bottom-panel { border-top: 1px solid var(--gray4); }
.panel-tabs { display: flex; border-bottom: 1px solid var(--gray4); }
.panel-tab {
  flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: 600;
  cursor: pointer; color: var(--gray2);
}
.panel-tab.active { color: var(--orange); border-bottom: 2px solid var(--orange); }
.panel-tab .count { background: var(--orange); color: white; border-radius: 10px; padding: 1px 6px; font-size: 11px; margin-right: 4px; }

.panel-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 6px; }
.panel-search { padding: 0 16px 8px; position: relative; }
.unassigned-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px;
  border-bottom: 1px solid var(--gray5); cursor: pointer;
}
.unassigned-item .drag { color: var(--gray3); font-size: 16px; }
.assigned-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--gray5); }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <div style="display:flex;gap:3px;align-items:flex-end">
      <div style="width:3px;height:5px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:8px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:11px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:14px;background:#1C1C1C;border-radius:1px"></div>
    </div>
    <div>9:41</div>
    <div style="display:flex;gap:5px;align-items:center;font-size:16px">&#x1F4F6; &#x1F50B;</div>
  </div>

  <div class="nav-bar">
    <div style="display:flex;gap:8px">
      <div class="nav-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </div>
      <div class="nav-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
        </svg>
      </div>
    </div>
    <div class="title">עורך סידור ישיבה</div>
    <div class="nav-back">›</div>
  </div>

  <div style="flex:1;overflow-y:auto;direction:rtl">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="tool-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
          <line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/>
          <circle cx="1" cy="6" r="1"/><circle cx="1" cy="12" r="1"/><circle cx="1" cy="18" r="1"/>
        </svg>
        <span>הגדרות מפה</span>
      </div>
      <div class="tool-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
          <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <span>שיוך אוטומטי</span>
      </div>
      <div class="tool-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
        </svg>
        <span>שולחן מרובע</span>
      </div>
      <div class="tool-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
          <circle cx="12" cy="12" r="9"/>
        </svg>
        <span>שולחן עגול</span>
      </div>
    </div>

    <!-- Tables Grid -->
    <div class="tables-grid">
      <!-- Table 8 - Selected/Full -->
      <div class="table-circle-wrap">
        <div class="table-circle selected">
          <!-- Seats around top -->
          <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot filled"></div>
          </div>
          <!-- Seats right -->
          <div style="position:absolute;right:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot filled"></div>
          </div>
          <!-- Seats bottom -->
          <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot filled"></div>
          </div>
          <!-- Seats left -->
          <div style="position:absolute;left:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot filled"></div>
          </div>
          <div class="table-name">שולחן</div>
          <div class="table-num">8</div>
          <div class="table-capacity full">12/12</div>
        </div>
      </div>

      <!-- Table 7 -->
      <div class="table-circle-wrap">
        <div class="table-circle">
          <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;right:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;left:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot"></div>
          </div>
          <div class="table-name">שולחן</div>
          <div class="table-num">7</div>
          <div class="table-capacity">8/10</div>
        </div>
      </div>

      <!-- Table 10 - Empty -->
      <div class="table-circle-wrap">
        <div class="table-circle">
          <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;right:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;left:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot"></div><div class="seat-dot"></div>
          </div>
          <div class="table-name">שולחן</div>
          <div class="table-num">10</div>
          <div class="table-capacity">0/8</div>
        </div>
      </div>

      <!-- Table 9 -->
      <div class="table-circle-wrap">
        <div class="table-circle">
          <div style="position:absolute;top:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;right:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot"></div><div class="seat-dot filled"></div>
          </div>
          <div style="position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot"></div>
          </div>
          <div style="position:absolute;left:-6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px">
            <div class="seat-dot filled"></div><div class="seat-dot"></div>
          </div>
          <div class="table-name">שולחן</div>
          <div class="table-num">9</div>
          <div class="table-capacity">4/10</div>
        </div>
      </div>
    </div>

    <div style="padding:4px 16px;text-align:left">
      <button style="background:white;border:1.5px solid var(--gray4);border-radius:20px;padding:6px 16px;font-size:13px;cursor:pointer;color:var(--dark)">גרור אורחים מהרשימה לשולחנות</button>
    </div>

    <!-- Bottom Panel -->
    <div class="bottom-panel">
      <div class="panel-tabs">
        <div class="panel-tab active" style="display:flex;align-items:center;justify-content:center;gap:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
          </svg>
          <span class="count">4</span>
          אורחים ללא שייך
        </div>
        <div class="panel-tab" style="display:flex;align-items:center;justify-content:center;gap:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
          </svg>
          שולחן 8 (3)
        </div>
      </div>

      <!-- Unassigned side -->
      <div class="panel-search">
        <input class="input-field" style="padding:9px 14px;font-size:13px" type="text" placeholder="...חפש אורח">
        <span style="position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--gray3)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
      </div>

      <div class="unassigned-item">
        <div class="drag">⋮⋮</div>
        <div style="flex:1;text-align:right">
          <div style="font-size:14px;font-weight:700">משפחת לוי</div>
          <div style="font-size:12px;color:var(--gray2)">משפחת כלה • 4 + אורחים</div>
        </div>
        <div style="color:var(--orange);font-size:18px">+</div>
      </div>
      <div class="unassigned-item">
        <div class="drag">⋮⋮</div>
        <div style="flex:1;text-align:right">
          <div style="font-size:14px;font-weight:700">עומר כהן</div>
          <div style="font-size:12px;color:var(--gray2)">חברים חתן • 2 + אורחים</div>
        </div>
        <div style="color:var(--orange);font-size:18px">+</div>
      </div>
      <div class="unassigned-item">
        <div class="drag">⋮⋮</div>
        <div style="flex:1;text-align:right">
          <div style="font-size:14px;font-weight:700;color:var(--gray2)">שורה נוצחי...</div>
        </div>
        <div style="color:var(--orange);font-size:18px">+</div>
      </div>
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      יצוא
    </div>
    <div class="tab-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
      </svg>
      ישיבה
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
      </svg>
      אורחים
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      דאשבורד
    </div>
  </div>
</div>
</body>
</html>
