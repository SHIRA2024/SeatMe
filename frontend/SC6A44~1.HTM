<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1200">
<title>EventFlow – היכן אני יושב</title>
<link rel="stylesheet" href="shared.css">
<style>
body { background:var(--gray5); display:flex; justify-content:center; padding:40px 20px; }
.guest-shell { width:100%; max-width:960px; }
.guest-topnav { background:white; border-radius:var(--radius-lg); border:1px solid var(--gray4); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; box-shadow:var(--shadow-sm); }
.guest-topnav .logo { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; }
.guest-topnav .logo-icon { width:38px; height:38px; background:var(--dark); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; }
</style>
</head>
<body>
<div class="guest-shell">
  <nav class="guest-topnav">
    <div class="logo"><div class="logo-icon">⚡</div>EventFlow</div>
    <div style="display:flex;gap:8px">
      <a href="screen1-event-details.html" class="btn btn-secondary btn-sm">← פרטי האירוע</a>
    </div>
  </nav>

  <div class="page-header">
    <div>
      <div class="page-title">שלום, איתי לוי 👋</div>
      <div class="page-subtitle">:הנה פרטי הישיבה שלך</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
    <!-- Seat Info -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="background:var(--orange-light);border:2px solid var(--orange);text-align:center;padding:32px 24px">
        <div style="width:64px;height:64px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;border:2px solid var(--orange-mid)">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/></svg>
        </div>
        <p style="font-size:14px;color:var(--gray2);margin-bottom:8px">המיקום השמור לך</p>
        <div style="font-size:56px;font-weight:900;line-height:1;color:var(--dark)">שולחן 12</div>
        <p style="font-size:15px;color:var(--gray2);margin-top:8px">שולחן משפחה קרובה</p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px">
          <div style="background:white;border-radius:var(--radius);padding:14px;text-align:center">
            <div style="font-size:28px;font-weight:800">2</div>
            <div style="font-size:12px;color:var(--gray2)">אורחים</div>
          </div>
          <div style="background:white;border-radius:var(--radius);padding:14px;text-align:center">
            <div style="font-size:28px;font-weight:800">4</div>
            <div style="font-size:12px;color:var(--gray2)">כיסא</div>
          </div>
        </div>
      </div>

      <div class="card" style="border:1.5px solid var(--gray4)">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gray2)" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          ?מעוניינים בשינוי
        </div>
        <p style="font-size:13px;color:var(--gray2);margin-bottom:12px">ניתן לבקש החלפת שולחן או הוספת מושב.</p>
        <button class="btn btn-ghost btn-full">בקש שינוי</button>
      </div>
    </div>

    <!-- Hall Map -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <span style="font-size:12px;background:var(--gray5);border:1px solid var(--gray4);border-radius:20px;padding:4px 12px;color:var(--gray2)">שער כניסה בצד ימין</span>
        <div style="font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>
          מפת האולם
        </div>
      </div>
      <div style="border-radius:var(--radius);overflow:hidden;margin-bottom:12px">
        <svg width="100%" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
          <rect width="500" height="300" fill="#E8E0D5"/>
          <rect x="180" y="12" width="140" height="45" rx="8" fill="#C8C0B5"/>
          <text x="250" y="40" text-anchor="middle" font-size="12" fill="#888">במה</text>
          <circle cx="60" cy="110" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="60" y="115" text-anchor="middle" font-size="10" fill="#666">1</text>
          <circle cx="140" cy="110" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="140" y="115" text-anchor="middle" font-size="10" fill="#666">2</text>
          <circle cx="220" cy="110" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="220" y="115" text-anchor="middle" font-size="10" fill="#666">3</text>
          <circle cx="300" cy="110" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="300" y="115" text-anchor="middle" font-size="10" fill="#666">4</text>
          <circle cx="380" cy="110" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="380" y="115" text-anchor="middle" font-size="10" fill="#666">5</text>
          <circle cx="440" cy="110" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="440" y="115" text-anchor="middle" font-size="10" fill="#666">6</text>
          <circle cx="60" cy="210" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="60" y="215" text-anchor="middle" font-size="10" fill="#666">7</text>
          <circle cx="140" cy="210" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="140" y="215" text-anchor="middle" font-size="10" fill="#666">8</text>
          <circle cx="220" cy="210" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="220" y="215" text-anchor="middle" font-size="10" fill="#666">9</text>
          <circle cx="300" cy="210" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="300" y="215" text-anchor="middle" font-size="10" fill="#666">10</text>
          <circle cx="380" cy="210" r="28" fill="#D4C9BC" stroke="#B8AFA6" stroke-width="1.5"/><text x="380" y="215" text-anchor="middle" font-size="10" fill="#666">11</text>
          <circle cx="440" cy="210" r="32" fill="#E8913A" opacity="0.9"/>
          <text x="440" y="215" text-anchor="middle" font-size="11" fill="white" font-weight="bold">12</text>
          <rect x="374" y="170" width="84" height="22" rx="5" fill="white" opacity="0.92"/>
          <text x="416" y="185" text-anchor="middle" font-size="11" fill="#E8913A" font-weight="bold">השולחן שלך</text>
          <rect x="0" y="270" width="500" height="30" fill="rgba(0,0,0,0.1)"/>
          <text x="250" y="290" text-anchor="middle" font-size="11" fill="white">← כניסה ראשית</text>
        </svg>
      </div>
      <div style="display:flex;gap:16px;justify-content:flex-end">
        <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray2)"><div style="width:10px;height:10px;border-radius:50%;background:var(--gray3)"></div> שולחנות אחרים</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gray2)"><div style="width:10px;height:10px;border-radius:50%;background:var(--orange)"></div> המקום שלך</div>
      </div>
      <p style="font-size:13px;color:var(--gray2);margin-top:10px;text-align:center">.השולחן ממוקם בצד ימין של האולם, קרוב לרחבת הריקודים</p>
    </div>
  </div>
</div>
</body>
</html>
