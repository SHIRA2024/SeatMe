<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1200">
<title>EventFlow – שיוך מושב</title>
<link rel="stylesheet" href="shared.css">
<style>
.modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200 }
.modal { background:white;border-radius:var(--radius-lg);padding:32px;width:520px;max-width:95vw;box-shadow:var(--shadow-lg) }
.info-box-2col { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="app-sidebar"></aside>
  <div class="main-area" style="position:relative">
    <header class="topbar">
      <div class="topbar-right"><div id="topbar-title"></div></div>
      <div class="topbar-left" id="topbar-right"></div>
    </header>
    <!-- Background seating view (blurred) -->
    <main class="page-content" style="filter:blur(2px);opacity:0.5;pointer-events:none">
      <div style="font-size:18px;font-weight:700;margin-bottom:16px">תצוגת מפה</div>
      <div style="background:#F0EDE8;border-radius:var(--radius-lg);height:400px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:30px;align-items:center;justify-items:center">
        <div style="width:100px;height:100px;border-radius:50%;border:2px solid var(--gray4);background:white;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:10px;color:var(--gray2)">שולחן</span><span style="font-size:24px;font-weight:900">1</span></div>
        <div style="width:100px;height:100px;border-radius:50%;border:2px solid var(--gray4);background:white;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:10px;color:var(--gray2)">שולחן</span><span style="font-size:24px;font-weight:900">2</span></div>
        <div style="width:110px;height:110px;border-radius:50%;border:3px solid var(--orange);background:var(--orange-light);display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:10px;color:var(--orange)">שולחן</span><span style="font-size:28px;font-weight:900;color:var(--orange)">14</span></div>
        <div style="width:100px;height:100px;border-radius:50%;border:2px solid var(--gray4);background:white;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:10px;color:var(--gray2)">שולחן</span><span style="font-size:24px;font-weight:900">4</span></div>
      </div>
    </main>

    <!-- Modal Overlay -->
    <div class="modal-overlay">
      <div class="modal">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <button class="btn btn-secondary btn-sm" onclick="history.back()">✕ סגור</button>
          <div style="font-size:18px;font-weight:800">פרטי שיוך אורח</div>
        </div>

        <!-- Profile Row -->
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--gray4)">
          <div style="text-align:right;flex:1">
            <h3 style="font-size:22px;font-weight:800">חיים כהן</h3>
            <p style="color:var(--gray2);font-size:14px;margin-top:3px">054-1234567</p>
            <div style="display:flex;gap:8px;margin-top:8px">
              <span class="badge badge-outline">קרוב משפחה (חתן)</span>
              <span class="badge badge-green">אישר הגעה (+1)</span>
            </div>
          </div>
          <div style="position:relative">
            <div class="avatar avatar-xl" style="background:#E0EEE0">👨</div>
            <div style="position:absolute;bottom:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#43A047;border:2px solid white"></div>
          </div>
        </div>

        <!-- Current Position -->
        <div style="font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/></svg>
          מיקום נוכחי
        </div>
        <div class="info-box-2col">
          <div style="background:var(--blue-light);border-radius:var(--radius);padding:16px;text-align:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1976D2" stroke-width="2" style="margin-bottom:6px"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/></svg>
            <div style="font-size:12px;color:var(--gray2);margin-bottom:4px">מספר מושב</div>
            <div style="font-size:26px;font-weight:800;color:#1565C0">2</div>
          </div>
          <div style="background:var(--orange-light);border-radius:var(--radius);padding:16px;text-align:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2" style="margin-bottom:6px"><circle cx="12" cy="12" r="8"/></svg>
            <div style="font-size:12px;color:var(--gray2);margin-bottom:4px">מספר שולחן</div>
            <div style="font-size:26px;font-weight:800;color:var(--orange)">14</div>
          </div>
        </div>

        <!-- Swap Option -->
        <div style="border:1.5px solid var(--gray4);border-radius:var(--radius);padding:14px;display:flex;align-items:center;gap:12px;margin-bottom:20px;cursor:pointer">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--dark)" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          <div style="flex:1;text-align:right">
            <div style="font-weight:700">החלף מושב בשולחן 14</div>
            <div style="font-size:13px;color:var(--gray2);margin-top:2px">מושבים פנויים: 5</div>
          </div>
          <div style="width:36px;height:36px;border-radius:50%;border:1.5px solid var(--gray4);display:flex;align-items:center;justify-content:center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1C1C" stroke-width="2"><circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="8"/></svg>
          </div>
        </div>

        <!-- Buttons -->
        <div style="display:flex;gap:12px">
          <button class="btn btn-primary" style="flex:1">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
            שמור שיוך
          </button>
          <button class="btn btn-danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><line x1="17" y1="8" x2="23" y2="8"/></svg>
            בטל שיוך
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="_shell.js"></script>
<script>renderShell({ active:'assign', pageTitle:'שיוך מושב' })</script>
</body>
</html>
