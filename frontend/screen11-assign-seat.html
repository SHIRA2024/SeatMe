<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventFlow – פרטי שיוך אורח</title>
<link rel="stylesheet" href="shared.css">
<style>
.backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 0;
}
.bottom-sheet {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 375px; background: white; border-radius: 24px 24px 0 0;
  padding-bottom: 32px; z-index: 10; box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
}
.sheet-handle {
  width: 40px; height: 4px; background: var(--gray4); border-radius: 4px;
  margin: 12px auto 16px;
}
.sheet-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px 16px; }
.close-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: var(--dark); font-size: 20px; cursor: pointer; }
.sheet-title { font-size: 17px; font-weight: 700; }

.profile-row { display: flex; align-items: center; gap: 12px; padding: 0 16px 20px; }
.sheet-avatar { width: 60px; height: 60px; border-radius: 50%; background: #E0EEE0; display: flex; align-items: center; justify-content: center; font-size: 28px; position: relative; flex-shrink: 0; }
.sheet-online { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background: #43A047; border: 2px solid white; }
.profile-info h3 { font-size: 20px; font-weight: 800; }
.profile-info p { font-size: 14px; color: var(--gray2); margin-top: 2px; }
.profile-tags { display: flex; gap: 6px; margin-top: 8px; }

.divider-line { height: 1px; background: var(--gray4); margin: 0 16px 20px; }

.info-2col { display: flex; gap: 12px; padding: 0 16px 16px; }
.info-box { flex: 1; border-radius: 12px; padding: 14px; text-align: center; }
.info-box.blue { background: var(--blue-light); }
.info-box.orange { background: var(--orange-light); }
.info-box .i-icon { margin-bottom: 6px; }
.info-box .i-label { font-size: 12px; color: var(--gray2); margin-bottom: 4px; }
.info-box .i-val { font-size: 22px; font-weight: 800; }
.info-box.blue .i-val { color: #1565C0; }
.info-box.orange .i-val { color: var(--orange); }

.swap-row {
  display: flex; align-items: center; gap: 12px; padding: 0 16px 20px; cursor: pointer;
}
.swap-row:hover { background: var(--gray5); }
.swap-icon { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--gray4); display: flex; align-items: center; justify-content: center; }
.swap-info { flex: 1; text-align: right; }
.swap-info h4 { font-size: 15px; font-weight: 700; }
.swap-info p { font-size: 13px; color: var(--gray2); margin-top: 2px; }
</style>
</head>
<body>
<!-- Background - simulated screen behind -->
<div style="width:375px;min-height:812px;background:#F0EDE8;position:relative;margin:0 auto">
  <!-- Background tables hint -->
  <div style="position:absolute;top:100px;left:60px;width:90px;height:90px;border-radius:50%;background:white;opacity:0.6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#888">
    <div>שולחן</div><div style="font-size:22px;font-weight:900">1</div><div>8/10</div>
  </div>
  <div style="position:absolute;top:60px;right:60px;width:90px;height:90px;border-radius:50%;background:white;opacity:0.6;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#888">
    <div>שולחן</div><div style="font-size:22px;font-weight:900">2</div><div>10/10</div>
  </div>
  <div style="position:absolute;top:220px;left:50%;transform:translateX(-50%);width:100px;height:100px;border-radius:50%;background:white;border:3px solid var(--orange);opacity:0.8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:#E8913A">
    <div>שולחן</div><div style="font-size:24px;font-weight:900">3</div><div>4/12</div>
  </div>
</div>

<div class="backdrop"></div>

<div class="bottom-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div style="width:30px"></div>
    <div class="sheet-title">פרטי שיוך אורח</div>
    <div class="close-btn">✕</div>
  </div>

  <!-- Profile -->
  <div class="profile-row">
    <div class="profile-info">
      <h3>חיים כהן</h3>
      <p>054-1234567</p>
      <div class="profile-tags">
        <span class="badge badge-orange-outline" style="font-size:12px">(קרוב משפחה (חתן</span>
        <span class="badge badge-gray" style="font-size:12px">(אישר הגעה (+1</span>
      </div>
    </div>
    <div class="sheet-avatar">
      👨
      <div class="sheet-online"></div>
    </div>
  </div>

  <!-- Current Seat -->
  <div style="padding:0 16px 12px;display:flex;align-items:center;gap:8px">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
      <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
    </svg>
    <span style="font-size:14px;font-weight:700">מיקום נוכחי</span>
  </div>

  <!-- Info 2 Col -->
  <div class="info-2col">
    <div class="info-box blue">
      <div class="i-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1565C0" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
        </svg>
      </div>
      <div class="i-label">מספר מושב</div>
      <div class="i-val">2</div>
    </div>
    <div class="info-box orange">
      <div class="i-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
          <circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="8"/>
        </svg>
      </div>
      <div class="i-label">מספר שולחן</div>
      <div class="i-val">14</div>
    </div>
  </div>

  <div class="divider-line"></div>

  <!-- Swap Row -->
  <div class="swap-row">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--dark)" stroke-width="2">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
    <div class="swap-info">
      <h4>החלף מושב בשולחן 14</h4>
      <p>מושבים פנויים 5</p>
    </div>
    <div class="swap-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1C1C" stroke-width="2">
        <circle cx="12" cy="12" r="2"/><circle cx="12" cy="12" r="8"/>
      </svg>
    </div>
  </div>

  <div class="divider-line"></div>

  <!-- Buttons -->
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:12px">
    <button class="btn-orange">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
      </svg>
      שמור שיוך
    </button>
    <button style="background:none;border:none;cursor:pointer;color:var(--red);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <line x1="17" y1="8" x2="23" y2="8"/>
      </svg>
      בטל שיוך שולחן
    </button>
  </div>
</div>
</body>
</html>
