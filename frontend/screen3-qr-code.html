<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventFlow – קוד כניסה</title>
<link rel="stylesheet" href="shared.css">
<style>
.success-banner {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  background: var(--white); border: 1.5px solid var(--gray4); border-radius: 50px;
  padding: 10px 20px; margin: 16px; font-size: 14px; font-weight: 600; color: var(--dark);
}
.success-banner .check {
  width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--dark);
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.qr-card {
  margin: 0 16px 16px; border-radius: 20px; overflow: hidden;
  border: 3px solid var(--orange); padding: 0;
}
.qr-card-header {
  background: white; padding: 24px 20px 16px; text-align: center; border-bottom: 1px solid var(--gray4);
}
.qr-card-header h2 { font-size: 20px; font-weight: 800; color: var(--dark); }
.qr-card-header p { font-size: 14px; color: var(--gray2); margin-top: 4px; }
.guest-tag {
  display: inline-block; border: 1px solid var(--gray4); border-radius: 20px;
  padding: 4px 14px; font-size: 13px; color: var(--dark); margin-top: 10px;
}
.qr-body { background: white; padding: 20px; display: flex; flex-direction: column; align-items: center; }
.qr-box {
  width: 200px; height: 200px; border: 1.5px solid var(--gray4); border-radius: 12px;
  display: flex; align-items: center; justify-content: center; background: white;
}
.link-row {
  display: flex; align-items: center; gap: 10px; background: var(--gray5); border-radius: 10px;
  padding: 12px 14px; margin-top: 16px; width: 100%;
}
.link-text { font-size: 14px; color: var(--dark); flex: 1; text-align: right; }
.copy-icon { color: var(--orange); font-size: 18px; cursor: pointer; }
.link-label { font-size: 12px; color: var(--gray2); text-align: center; margin-bottom: 8px; }
.footer-note { font-size: 12px; color: var(--gray2); text-align: center; padding: 0 24px; margin-bottom: 24px; line-height: 1.6; }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <div style="display:flex;gap:3px;align-items:flex-end">
      <div style="width:3px;height:5px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:8px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:11px;background:#1C1C1C;border-radius:1px"></div>
      <div style="width:3px;height:14px;background:#1C1C1C;border-radius:1px"></div>
    </div>
    <div>9:41</div>
    <div style="display:flex;gap:5px;align-items:center;font-size:16px">&#x1F4F6; &#x1F50B;</div>
  </div>

  <div class="nav-bar">
    <div class="nav-back">›</div>
    <div class="title">קוד כניסה</div>
    <div style="width:30px"></div>
  </div>

  <div class="content">
    <!-- Success Banner -->
    <div class="success-banner">
      <div class="check">✓</div>
      !האישור התקבל בהצלחה
    </div>

    <!-- QR Card -->
    <div class="qr-card">
      <div class="qr-card-header">
        <h2>החתונה של נועה ועידו</h2>
        <p>יום חמישי, 15 בספטמבר 2024</p>
        <div class="guest-tag">אורח: דניאל כהן</div>
      </div>
      <div class="qr-body">
        <!-- QR Code SVG -->
        <div class="qr-box">
          <svg width="160" height="160" viewBox="0 0 160 160">
            <!-- QR pattern simulation -->
            <rect x="10" y="10" width="50" height="50" fill="none" stroke="#000" stroke-width="3"/>
            <rect x="18" y="18" width="34" height="34" fill="#000"/>
            <rect x="100" y="10" width="50" height="50" fill="none" stroke="#000" stroke-width="3"/>
            <rect x="108" y="18" width="34" height="34" fill="#000"/>
            <rect x="10" y="100" width="50" height="50" fill="none" stroke="#000" stroke-width="3"/>
            <rect x="18" y="108" width="34" height="34" fill="#000"/>
            <!-- Data modules -->
            <rect x="70" y="10" width="8" height="8" fill="#000"/>
            <rect x="80" y="10" width="8" height="8" fill="#000"/>
            <rect x="70" y="20" width="8" height="8" fill="#000"/>
            <rect x="70" y="30" width="8" height="8" fill="#000"/>
            <rect x="80" y="30" width="8" height="8" fill="#000"/>
            <rect x="10" y="70" width="8" height="8" fill="#000"/>
            <rect x="20" y="70" width="8" height="8" fill="#000"/>
            <rect x="30" y="70" width="8" height="8" fill="#000"/>
            <rect x="10" y="80" width="8" height="8" fill="#000"/>
            <rect x="30" y="80" width="8" height="8" fill="#000"/>
            <rect x="70" y="70" width="8" height="8" fill="#000"/>
            <rect x="80" y="70" width="8" height="8" fill="#000"/>
            <rect x="90" y="70" width="8" height="8" fill="#000"/>
            <rect x="100" y="70" width="8" height="8" fill="#000"/>
            <rect x="110" y="70" width="8" height="8" fill="#000"/>
            <rect x="130" y="70" width="8" height="8" fill="#000"/>
            <rect x="140" y="70" width="8" height="8" fill="#000"/>
            <rect x="70" y="80" width="8" height="8" fill="#000"/>
            <rect x="90" y="80" width="8" height="8" fill="#000"/>
            <rect x="110" y="80" width="8" height="8" fill="#000"/>
            <rect x="120" y="80" width="8" height="8" fill="#000"/>
            <rect x="140" y="80" width="8" height="8" fill="#000"/>
            <rect x="70" y="90" width="8" height="8" fill="#000"/>
            <rect x="80" y="90" width="8" height="8" fill="#000"/>
            <rect x="100" y="90" width="8" height="8" fill="#000"/>
            <rect x="120" y="90" width="8" height="8" fill="#000"/>
            <rect x="130" y="90" width="8" height="8" fill="#000"/>
            <rect x="70" y="100" width="8" height="8" fill="#000"/>
            <rect x="90" y="100" width="8" height="8" fill="#000"/>
            <rect x="100" y="100" width="8" height="8" fill="#000"/>
            <rect x="110" y="100" width="8" height="8" fill="#000"/>
            <rect x="130" y="100" width="8" height="8" fill="#000"/>
            <rect x="140" y="100" width="8" height="8" fill="#000"/>
            <rect x="70" y="110" width="8" height="8" fill="#000"/>
            <rect x="80" y="110" width="8" height="8" fill="#000"/>
            <rect x="90" y="110" width="8" height="8" fill="#000"/>
            <rect x="110" y="110" width="8" height="8" fill="#000"/>
            <rect x="130" y="120" width="8" height="8" fill="#000"/>
            <rect x="70" y="130" width="8" height="8" fill="#000"/>
            <rect x="80" y="130" width="8" height="8" fill="#000"/>
            <rect x="90" y="130" width="8" height="8" fill="#000"/>
            <rect x="110" y="130" width="8" height="8" fill="#000"/>
            <rect x="120" y="130" width="8" height="8" fill="#000"/>
            <rect x="140" y="130" width="8" height="8" fill="#000"/>
            <rect x="70" y="140" width="8" height="8" fill="#000"/>
            <rect x="90" y="140" width="8" height="8" fill="#000"/>
            <rect x="110" y="140" width="8" height="8" fill="#000"/>
            <rect x="130" y="140" width="8" height="8" fill="#000"/>
          </svg>
        </div>

        <!-- Personal Link -->
        <p class="link-label" style="margin-top:16px">קישור אישי לכניסה</p>
        <div class="link-row">
          <span class="copy-icon">⧉</span>
          <span class="link-text">eflow.me/noa-ido-24-x7k</span>
        </div>
      </div>
    </div>

    <!-- Buttons -->
    <div style="padding:0 16px;display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
      <button class="btn-orange">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        שתף כרטיס כניסה
      </button>
      <button class="btn-outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        שמור לגלריה
      </button>
    </div>

    <div class="footer-note">
      יש להציג קוד זה בעמדת הרישום בכניסה לאירוע לצורך<br>זיהוי מהיר וקבלת מספר שולחן.
    </div>
  </div>

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
      אירוע
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <polyline points="9 16 11 18 15 14"/>
      </svg>
      אישור
    </div>
    <div class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      ישיבה
    </div>
    <div class="tab-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      קוד
    </div>
  </div>
</div>
</body>
</html>
