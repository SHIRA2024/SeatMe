<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1200">
<title>EventFlow – עריכת אישור הגעה</title>
<link rel="stylesheet" href="shared.css">
<style>
body { background:var(--gray5); display:flex; justify-content:center; padding:40px 20px; }
.guest-shell { width:100%; max-width:960px; }
.guest-topnav { background:white; border-radius:var(--radius-lg); border:1px solid var(--gray4); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; margin-bottom:28px; box-shadow:var(--shadow-sm); }
.guest-topnav .logo { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; }
.guest-topnav .logo-icon { width:38px; height:38px; background:var(--dark); border-radius:10px; display:flex; align-items:center; justify-content:center; color:white; font-size:20px; }
.toggle-btn { flex:1; border:1.5px solid var(--gray4); border-radius:var(--radius); padding:16px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; background:white; font-size:15px; font-weight:600; transition:all 0.2s; }
.toggle-btn.active { background:var(--orange); border-color:var(--orange); color:white; }
.toggle-btn:not(.active):hover { border-color:var(--orange); background:var(--orange-light); }
</style>
</head>
<body>
<div class="guest-shell">
  <nav class="guest-topnav">
    <div class="logo"><div class="logo-icon">⚡</div>EventFlow</div>
    <div style="display:flex;gap:8px">
      <a href="screen1-event-details.html" class="btn btn-secondary btn-sm">← פרטי האירוע</a>
    </div>
  </nav>

  <div style="background:var(--green-light);border:1px solid var(--green);border-radius:var(--radius-lg);padding:14px 20px;display:flex;align-items:center;gap:12px;margin-bottom:24px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
    <div>
      <div style="font-weight:700;color:var(--green)">!העדכון נשמר בהצלחה</div>
      <div style="font-size:13px;color:var(--gray2)">שלחנו לך מייל אישור עם הפרטים המעודכנים.</div>
    </div>
  </div>

  <div class="page-header">
    <div>
      <div class="page-title">עריכת אישור הגעה</div>
      <div class="page-subtitle">עדכנו את פרטי ההגעה שלכם לחתונה של עמית וירדן</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:1fr 300px;gap:24px">
    <!-- Form -->
    <div>
      <div class="card" style="margin-bottom:20px">
        <div class="form-group">
          <div style="font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            ?האם תגיעו
          </div>
          <div style="display:flex;gap:12px">
            <div class="toggle-btn">לצערי לא</div>
            <div class="toggle-btn active">!בטח שנגיע</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1C1C" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            (כמה תהיו? (כולל אתכם
          </label>
          <input class="input" type="text" placeholder="מספר אורחים">
          <p class="form-hint">ניתן להוסיף שמות אורחים נוספים בהערות.</p>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:8px">
            <span style="color:var(--orange)">♪</span>
            יש לכם שיר שחובה להשמיע?
          </label>
          <textarea class="input" rows="3" style="resize:vertical">Bohemian Rhapsody - Queen</textarea>
        </div>
      </div>

      <div style="display:flex;gap:12px">
        <button class="btn btn-primary btn-lg" style="flex:1">עדכן פרטים</button>
        <button class="btn btn-danger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          בטל אישור הגעה
        </button>
      </div>
    </div>

    <!-- Right Sidebar -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card" style="background:var(--orange-light);border-color:var(--orange-mid)">
        <div style="font-size:14px;font-weight:700;margin-bottom:12px">פרטי האירוע</div>
        <div style="font-size:14px;line-height:2">
          📅 24.09.2024<br>
          📍 אקו, חדרה
        </div>
      </div>
      <div class="card card-sm">
        <div style="font-size:13px;font-weight:700;margin-bottom:6px">סטטוס נוכחי</div>
        <div class="badge badge-orange" style="font-size:13px">✓ מגיע/ה</div>
        <div style="font-size:12px;color:var(--gray2);margin-top:6px">אורחים רשומים: 2</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
