<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1200">
<title>SeatMe – ניהול אירוע</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="app-sidebar"></aside>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-right">
        <div id="topbar-title"></div>
      </div>
      <div class="topbar-left" id="topbar-right">
        <div class="topbar-search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg> חפש אורח...</div>
        <div class="topbar-icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <div>
          <div class="page-title">ניהול אירוע</div>
          <div class="page-subtitle" id="eventSubtitle">טוען...</div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-secondary" onclick="location='SC72CE~1.HTM'">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/></svg>
            יצוא
          </button>
          <button class="btn btn-primary" onclick="location='SC8099~1.HTM'">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
            עורך ישיבה
          </button>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid-4" style="margin-bottom:24px">
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--blue-light)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1976D2" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>
          </div>
          <div><div class="stat-num" style="color:#1976D2" id="statTotal">—</div><div class="stat-label">מוזמנים</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--green-light)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div><div class="stat-num" style="color:var(--green)" id="statYes">—</div><div class="stat-label">מאושרים</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--red-light)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
          </div>
          <div><div class="stat-num" style="color:var(--red)" id="statNo">—</div><div class="stat-label">ביטולים</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon" style="background:var(--orange-light)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--orange)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div><div class="stat-num" style="color:var(--orange)" id="statPending">—</div><div class="stat-label">טרם השיבו</div></div>
        </div>
      </div>


      <!-- Recent Activity Table -->
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <a href="SC9376~1.HTM" style="font-size:13px;color:var(--orange);text-decoration:none">צפה בכל האורחים →</a>
          <div style="font-size:16px;font-weight:700">פעילות אחרונה</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th></th>
              <th>שם</th>
              <th>אורחים</th>
              <th>זמן</th>
              <th>סטטוס</th>
            </tr></thead>
            <tbody id="recentBody">
              <tr><td colspan="5" style="text-align:center;color:var(--gray3);padding:24px">טוען...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="_api.js"></script>
<script src="_shell.js"></script>
<script>
renderShell({ active:'dashboard', pageTitle:'ניהול אירוע' });

window.addEventListener('DOMContentLoaded', async () => {
  const host_email = getHostEmail();
  if (!host_email) return;

  // Load host info
  const host = await apiGet('/hosts', { host_email });
  if (host.event_name || host.name) {
    const parts = [host.event_name || host.name];
    if (host.event_date) parts.push(host.event_date);
    if (host.location)   parts.push(host.location);
    document.getElementById('eventSubtitle').textContent = parts.join(' · ');
  }

  // Load guests + update stats
  const guests = await loadGuests();
  const yes     = guests.filter(g => g.rsvp === 'yes').length;
  const no      = guests.filter(g => g.rsvp === 'no').length;
  const pending = guests.filter(g => g.rsvp === '?' || !g.rsvp).length;

  document.getElementById('statTotal').textContent   = guests.length;
  document.getElementById('statYes').textContent     = yes;
  document.getElementById('statNo').textContent      = no;
  document.getElementById('statPending').textContent = pending;

  // Recent guests (last 5)
  const rsvpBadge = r => r === 'yes'
    ? '<span class="badge badge-green">אישר הגעה</span>'
    : r === 'no'
    ? '<span class="badge badge-red">ביטל</span>'
    : '<span class="badge badge-gray">טרם השיב</span>';

  const recent = guests.slice(-5).reverse();
  document.getElementById('recentBody').innerHTML = recent.length
    ? recent.map(g => `
        <tr style="cursor:pointer" onclick="location='SCE6A5~1.HTM?guest=${encodeURIComponent(g.email)}'">
          <td><div class="avatar">${g.name?g.name[0]:'?'}</div></td>
          <td style="font-weight:700">${g.name || g.email}</td>
          <td>${g.count || 1}</td>
          <td style="color:var(--gray2)">${g.category || ''}</td>
          <td>${rsvpBadge(g.rsvp)}</td>
        </tr>`).join('')
    : '<tr><td colspan="5" style="text-align:center;color:var(--gray3);padding:24px">אין אורחים עדיין</td></tr>';
});
</script>
</body>
</html>
