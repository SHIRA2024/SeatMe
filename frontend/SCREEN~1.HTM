<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הזמנה</title>
<link rel="stylesheet" href="shared.css">
<style>
body { background:var(--gray5); display:flex; justify-content:center; padding:24px 16px 60px; min-height:100vh; }
.shell { width:100%; max-width:560px; }

.logo-bar { text-align:center; margin-bottom:18px; }
.logo-pill { display:inline-flex; align-items:center; gap:8px; background:white; border:1px solid var(--gray4); border-radius:20px; padding:6px 16px; box-shadow:var(--shadow-sm); }
.logo-icon { width:28px; height:28px; background:var(--dark); border-radius:8px; display:flex; align-items:center; justify-content:center; color:white; font-size:16px; }

.hero { border-radius:var(--radius-lg); overflow:hidden; height:200px; position:relative; margin-bottom:18px; box-shadow:var(--shadow); }
.hero-overlay { position:absolute; inset:0; background:linear-gradient(to bottom, transparent 25%, rgba(0,0,0,0.62)); }
.hero-content { position:absolute; bottom:20px; right:20px; color:white; }
.hero-title { font-size:30px; font-weight:900; letter-spacing:-0.5px; }
.hero-date { font-size:14px; opacity:0.9; margin-top:3px; }

.info-row { display:flex; align-items:center; justify-content:flex-end; gap:14px; padding:13px 0; border-bottom:1px solid var(--gray5); }
.info-row:last-child { border-bottom:none; }
.info-label { font-size:12px; color:var(--gray2); margin-bottom:2px; }
.info-value { font-size:15px; font-weight:700; }

.rsvp-btn { flex:1; border:2px solid var(--gray4); border-radius:var(--radius); padding:18px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; background:white; transition:all 0.2s; }
.rsvp-btn span.label { font-size:15px; font-weight:700; color:var(--dark); }
.rsvp-btn:hover { border-color:var(--orange); background:var(--orange-light); }
.rsvp-btn.active-yes { background:var(--green); border-color:var(--green); }
.rsvp-btn.active-yes span.label { color:white; }
.rsvp-btn.active-no  { background:#EF5350; border-color:#EF5350; }
.rsvp-btn.active-no  span.label { color:white; }

.counter-row { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border:1.5px solid var(--gray4); border-radius:var(--radius); }
.counter-btn { width:38px; height:38px; border-radius:50%; border:2px solid var(--orange); color:var(--orange); font-size:22px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; background:white; transition:background 0.15s; }
.counter-btn:hover { background:var(--orange-light); }
.counter-val { font-size:32px; font-weight:900; color:var(--dark); }

.success-wrap { text-align:center; padding:32px 20px; background:white; border-radius:var(--radius-lg); border:2px solid var(--green); }
</style>
</head>
<body>
<div class="shell">

  <!-- Logo -->
  <div class="logo-bar">
    <div class="logo-pill">
      <div class="logo-icon">⚡</div>
      <span style="font-weight:700;font-size:15px">SeatMe</span>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 560 200" preserveAspectRatio="xMidYMid slice">
      <rect width="560" height="200" fill="url(#hg)"/>
      <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#d4c4a8"/>
        <stop offset="50%" stop-color="#e8d5b0"/>
        <stop offset="100%" stop-color="#c9b99a"/>
      </linearGradient></defs>
      <ellipse cx="100" cy="160" rx="130" ry="80" fill="rgba(255,220,180,0.35)"/>
      <ellipse cx="430" cy="140" rx="160" ry="90" fill="rgba(240,200,150,0.3)"/>
    </svg>
    <div class="hero-overlay"></div>
    <div style="position:absolute;top:14px;right:16px">
      <span class="badge badge-orange" style="font-size:12px;padding:4px 12px">הזמנה רשמית</span>
    </div>
    <div class="hero-content">
      <div class="hero-title" id="heroTitle">...</div>
      <div class="hero-date" id="heroDate"></div>
    </div>
  </div>

  <!-- Greeting -->
  <div class="card" style="margin-bottom:14px;text-align:center;padding:20px 16px">
    <div style="font-size:22px;font-weight:800" id="greetingName">שלום!</div>
    <div style="font-size:14px;color:var(--gray2);margin-top:4px">נשמח לראותך בין אורחינו</div>
  </div>

  <!-- Event Info -->
  <div class="card" style="margin-bottom:14px">
    <div class="info-row">
      <div style="text-align:right">
        <div class="info-label">תאריך</div>
        <div class="info-value" id="eventDate">טוען...</div>
      </div>
      <div class="icon-box icon-box-orange">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
    </div>
    <div class="info-row" id="locationRow" style="display:none">
      <div style="text-align:right">
        <div class="info-label">מיקום</div>
        <div class="info-value" id="eventLocation"></div>
      </div>
      <div class="icon-box icon-box-orange">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E8913A" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </div>
    </div>
  </div>

  <!-- RSVP Section -->
  <div id="rsvpSection">

    <!-- Yes / No -->
    <div class="card" style="margin-bottom:14px">
      <div class="card-title">האם תגיע/י לאירוע?</div>
      <div style="display:flex;gap:12px">
        <div class="rsvp-btn" id="btnNo" onclick="setRsvp('no')">
          <span style="font-size:28px">😔</span>
          <span class="label">לא אוכל</span>
        </div>
        <div class="rsvp-btn" id="btnYes" onclick="setRsvp('yes')">
          <span style="font-size:28px">🎉</span>
          <span class="label">מגיע/ה!</span>
        </div>
      </div>
    </div>

    <!-- Count + Song (shown only if yes) -->
    <div id="yesDetails" style="display:none">
      <div class="card" style="margin-bottom:14px">
        <div class="card-title">כמה אורחים תהיו?</div>
        <div class="counter-row">
          <div style="display:flex;gap:12px">
            <div class="counter-btn" onclick="changeCount(1)">+</div>
            <div class="counter-btn" onclick="changeCount(-1)">−</div>
          </div>
          <div class="counter-val" id="guestCountDisplay">1</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px">
        <div class="card-title" style="display:flex;align-items:center;gap:6px">
          <span style="color:var(--orange)">♪</span> בקשת שיר (אופציונלי)
        </div>
        <input class="input" id="songRequest" type="text" placeholder="שם השיר והאמן...">
      </div>
    </div>

    <!-- Submit -->
    <button class="btn btn-primary btn-full btn-lg" id="submitBtn"
            onclick="doSubmit()" style="display:none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
      שלח אישור הגעה
    </button>

  </div>

  <!-- Success (shown after submit) -->
  <div id="successSection" style="display:none">
    <div class="success-wrap">
      <div style="font-size:52px;margin-bottom:12px" id="successEmoji">✅</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:6px" id="successTitle"></div>
      <div style="font-size:14px;color:var(--gray2)" id="successMsg"></div>
    </div>
    <div id="seatCard" style="display:none;margin-top:14px">
      <div class="card" style="text-align:center;padding:20px">
        <div style="font-size:13px;color:var(--gray2);margin-bottom:4px">השולחן שלך</div>
        <div style="font-size:52px;font-weight:900;color:var(--orange)" id="seatNum">—</div>
      </div>
    </div>
    <button onclick="showRsvpForm()"
      style="width:100%;margin-top:14px;padding:14px;border:1.5px solid var(--gray4);border-radius:var(--radius);background:white;font-size:14px;font-weight:600;cursor:pointer;color:var(--gray1)">
      ✏️ שינוי סטטוס הגעה
    </button>
  </div>

</div>

<script src="_api.js"></script>
<script>
const params     = new URLSearchParams(location.search);
const hostEmail  = params.get('host')  || '';
const guestEmail = params.get('guest') || '';
let currentRsvp  = null;
let guestTable   = null;

function showRsvpForm() {
  document.getElementById('successSection').style.display = 'none';
  document.getElementById('rsvpSection').style.display    = 'block';
}

function setRsvp(val) {
  currentRsvp = val;
  document.getElementById('btnYes').className = 'rsvp-btn' + (val === 'yes' ? ' active-yes' : '');
  document.getElementById('btnNo').className  = 'rsvp-btn' + (val === 'no'  ? ' active-no'  : '');
  document.getElementById('yesDetails').style.display = val === 'yes' ? 'block' : 'none';
  document.getElementById('submitBtn').style.display  = 'block';
}

function changeCount(d) {
  const el = document.getElementById('guestCountDisplay');
  el.textContent = Math.max(1, parseInt(el.textContent || 1) + d);
}

async function doSubmit() {
  if (!currentRsvp) { alert('יש לבחור האם מגיע/ה'); return; }
  const btn   = document.getElementById('submitBtn');
  const count = parseInt(document.getElementById('guestCountDisplay').textContent) || 1;
  const song  = document.getElementById('songRequest')?.value?.trim() || '';

  btn.disabled    = true;
  btn.textContent = 'שולח...';

  const data = await apiPost('/guests/rsvp', {
    host_email: hostEmail, guest_email: guestEmail,
    rsvp: currentRsvp, count, song
  });

  if (data.guest_email || data.rsvp) {
    const newCount = parseInt(document.getElementById('guestCountDisplay').textContent) || 1;
    document.getElementById('rsvpSection').style.display    = 'none';
    document.getElementById('successSection').style.display = 'block';
    if (currentRsvp === 'yes') {
      document.getElementById('successEmoji').textContent = '🎉';
      document.getElementById('successTitle').textContent = 'אישרת הגעה!';
      document.getElementById('successMsg').textContent   = newCount > 1 ? `${newCount} אורחים` : 'מחכים לך!';
    } else {
      document.getElementById('successEmoji').textContent = '😔';
      document.getElementById('successTitle').textContent = 'ציינת שלא תוכל להגיע';
      document.getElementById('successMsg').textContent   = 'תמיד אפשר לשנות דעה ↓';
    }
    if (guestTable) {
      document.getElementById('seatNum').textContent     = guestTable;
      document.getElementById('seatCard').style.display = 'block';
    }
  } else {
    btn.disabled    = false;
    btn.textContent = 'שלח אישור הגעה';
    alert('שגיאה: ' + (data.message || JSON.stringify(data)));
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  if (!hostEmail) return;

  const months = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  // Load host
  const host      = await apiGet('/hosts', { host_email: hostEmail });
  const eventName = host.event_name || host.name || 'האירוע שלנו';
  document.getElementById('heroTitle').textContent = eventName;
  document.title = eventName;

  if (host.event_date) {
    const p = host.event_date.split('-');
    if (p.length === 3) {
      const dateStr = `${parseInt(p[2])} ב${months[parseInt(p[1])-1]} ${p[0]}`;
      document.getElementById('eventDate').textContent = dateStr;
      document.getElementById('heroDate').textContent  = '📅 ' + dateStr;
    }
  }

  if (host.location) {
    document.getElementById('eventLocation').textContent = host.location;
    document.getElementById('locationRow').style.display = 'flex';
  }

  // Load guest
  if (!guestEmail) return;
  const gData  = await apiGet('/guests', { host_email: hostEmail });
  const guests = gData.guests || {};
  const g      = guests[guestEmail];
  if (!g) return;

  const name = g.name || guestEmail;
  document.getElementById('greetingName').textContent = 'שלום, ' + name + '!';

  // Pre-fill form fields always (ready for when guest clicks "change")
  if (g.rsvp === 'yes' || g.rsvp === 'no') {
    setRsvp(g.rsvp);
  }
  if (g.count) document.getElementById('guestCountDisplay').textContent = g.count;
  if (g.song)  document.getElementById('songRequest').value             = g.song;

  // Show status card for guests who already responded OR have a table
  if (g.rsvp === 'yes' || g.rsvp === 'no' || g.table) {
    document.getElementById('rsvpSection').style.display    = 'none';
    document.getElementById('successSection').style.display = 'block';

    if (g.table) {
      guestTable = g.table;
      document.getElementById('seatNum').textContent    = g.table;
      document.getElementById('seatCard').style.display = 'block';
      document.getElementById('successEmoji').textContent = '🪑';
      document.getElementById('successTitle').textContent = 'השולחן שלך מוכן';
      document.getElementById('successMsg').textContent   = 'אתה משובץ לאירוע. נתראה שם!';
    } else if (g.rsvp === 'yes') {
      document.getElementById('successEmoji').textContent = '🎉';
      document.getElementById('successTitle').textContent = 'אישרת הגעה!';
      const cnt = parseInt(g.count) || 1;
      document.getElementById('successMsg').textContent   = cnt > 1 ? `${cnt} אורחים` : 'מחכים לך!';
    } else {
      document.getElementById('successEmoji').textContent = '😔';
      document.getElementById('successTitle').textContent = 'ציינת שלא תוכל להגיע';
      document.getElementById('successMsg').textContent   = 'תמיד אפשר לשנות דעה ↓';
    }
  }
});
</script>
</body>
</html>
